server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # Toda la API y los archivos del padrón permanecen en el mismo origen que
    # Flutter Web. El navegador no necesita CORS ni conocer el puerto 8080.
    location ^~ /api/ {
        proxy_pass http://federa-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Se conservan para diagnóstico del entorno Docker.
    location = /swagger-ui.html {
        proxy_pass http://federa-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger-ui/ {
        proxy_pass http://federa-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://federa-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estos archivos deciden qué versión de Flutter se carga; no deben quedar
    # congelados en un navegador después de desplegar una actualización.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Reutilizar los bytes guardados con validación ETag: los nombres de estos
    # archivos no llevan hash y pueden cambiar en un despliegue.
    location ~* \.(?:ttf|otf|woff2?|wasm|js|json|bin|tflite|data)$ {
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf application/x-font-ttf application/octet-stream;
}
